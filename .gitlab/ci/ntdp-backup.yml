# Controlled logical backup job template.
#
# This file is intentionally not wired into the default pipeline until a
# protected backup destination and CI secret policy are approved. Production
# database dumps must never be stored as GitLab job artifacts by default.

ntdp_logical_backup:
  stage: deploy
  script:
    - chmod +x scripts/ntdp-db-backup.sh
    - PROJECT_REF="$SUPABASE_PROJECT_REF" OUTPUT_DIR="/tmp/ntdp-backups" scripts/ntdp-db-backup.sh
    - echo "Backup completed; transfer the dump to the approved encrypted off-site destination."
  rules:
    - when: manual
  allow_failure: false
