image: node:22-alpine

stages:
  - verify
  - smoke
  - deploy

cache:
  paths:
    - node_modules/

build:
  stage: verify
  script:
    - npm install
    - npm run test
    - npm run build
    - npm run build:server
  rules:
    - if: '$CI_COMMIT_BRANCH'

api_smoke:
  stage: smoke
  allow_failure: true
  script:
    - node scripts/api-smoke.mjs
  rules:
    - if: '$CI_COMMIT_BRANCH'

pages:
  stage: deploy
  script:
    - npm install
    - npm run build
    - mkdir -p public-pages
    - cp -r dist/. public-pages/
  artifacts:
    paths:
      - public-pages
  pages:
    publish: public-pages
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
